# Read the Docs build configuration.
#
# RTD reads this from the repo root, builds docs/conf.py with the
# given Python, and hosts the result with per-tag versioning.
#
# docs/requirements.txt installs markwork from this checkout (the '.'
# line), since the docs are markwork documenting itself, plus the theme.
# The documented source is only read as text, never imported.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
